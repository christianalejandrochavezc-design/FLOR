<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz 1 Mes My Love</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at top, #ff758f, #2b1055);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
        text-align: center;
    }

    h1 {
        color: white;
        font-size: 2.2em;
        margin: 20px 10px;
        animation: glow 2s infinite alternate;
    }

    .rose {
        position: relative;
        width: 180px;
        height: 260px;
        animation: float 4s ease-in-out infinite;
        margin-bottom: 20px;
    }

    .petal {
        position: absolute;
        width: 90px;
        height: 130px;
        background: radial-gradient(circle at top, #ff4d6d, #b11226);
        border-radius: 50%;
        top: 30px;
        left: 45px;
        transform-origin: bottom center;
    }

    .petal:nth-child(1) { transform: rotate(0deg); }
    .petal:nth-child(2) { transform: rotate(45deg); }
    .petal:nth-child(3) { transform: rotate(-45deg); }
    .petal:nth-child(4) { transform: rotate(90deg); }

    .center {
        position: absolute;
        width: 55px;
        height: 55px;
        background: radial-gradient(circle, #ffd6e0, #ff4d6d);
        border-radius: 50%;
        top: 90px;
        left: 62px;
        box-shadow: 0 0 20px rgba(255, 0, 76, 0.7);
    }

    .stem {
        position: absolute;
        width: 10px;
        height: 140px;
        background: linear-gradient(to bottom, #2ecc71, #145a32);
        top: 170px;
        left: 85px;
        border-radius: 10px;
    }

    .leaf {
        position: absolute;
        width: 55px;
        height: 28px;
        background: #2ecc71;
        border-radius: 50%;
        top: 220px;
        left: 35px;
        transform: rotate(-20deg);
    }

    .leaf.right {
        left: 90px;
        transform: rotate(20deg);
    }

    button {
        margin-top: 10px;
        padding: 14px 35px;
        font-size: 1.2em;
        border: none;
        border-radius: 30px;
        background: linear-gradient(to right, #ff4d6d, #ff758f);
        color: white;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        animation: pulse 1.5s infinite;
    }

    button:active {
        transform: scale(0.95);
    }

    .message {
        display: none;
        color: #fff;
        font-size: 1.3em;
        margin-top: 15px;
        animation: fadeIn 1s forwards;
    }

    /* Corazones */
    .heart {
        position: fixed;
        top: -20px;
        font-size: 20px;
        animation: fall linear forwards;
        color: #ff4d6d;
        opacity: 0.8;
        pointer-events: none;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh);
            opacity: 0;
        }
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #ff4d6d; }
        to { text-shadow: 0 0 25px #ffd6e0; }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.07); }
        100% { transform: scale(1); }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>

<body>

<h1>🌹 FELIZ 1 MES MY LOVE 🌹</h1>

<div class="rose">
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="center"></div>
    <div class="stem"></div>
    <div class="leaf"></div>
    <div class="leaf right"></div>
</div>

<button onclick="showLove()">💖 TE AMO 💖</button>

<div class="message" id="loveMessage">
    Gracias por este mes MI NIÑITA PRECIOSA 💕<br>
    TE AMO PRINCESS🌹
</div>

<script>
    function showLove() {
        document.getElementById("loveMessage").style.display = "block";
    }

    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 2) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }

    setInterval(createHeart, 400);
</script>

</body>
</html>
